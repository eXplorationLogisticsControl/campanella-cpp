[project]
name = "campanella-cpp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yuri", email = "yuri.shimane@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "spiceypy>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# build directories contain third-party tests (e.g. GoogleTest's)
testpaths = ["test-python"]

[dependency-groups]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-book-theme>=1.4.0",
    "sphinxcontrib-bibtex>=2.7.0",
]
